name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v5
        with:
          name: amogusmod
          path: build/libs/*.jar
          if-no-files-found: error

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri imagemagick xdotool

      - name: Start dedicated server
        run: .github/scripts/smoke-test.sh server

      - name: Start client
        run: .github/scripts/smoke-test.sh client

      - name: Print screenshots
        if: always()
        run: |
          for f in screenshots/*.png; do
            [ -f "$f" ] || continue
            echo "=== BEGIN $f"
            convert "$f" -resize 800x450 -quality 80 jpg:- | base64 -w 120
            echo "=== END $f"
          done

      # Temporary: lets the screenshots be reviewed from a git checkout
      - name: Push screenshots
        if: github.event_name == 'pull_request' && hashFiles('.github/smoke/push-screenshots') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${{ github.head_ref }}"
          git checkout -B screenshots "origin/${{ github.head_ref }}"
          mkdir -p docs/screenshots
          for f in screenshots/*.png; do convert "$f" -quality 85 "docs/screenshots/$(basename "$f" .png).jpg"; done
          git rm -q .github/smoke/push-screenshots
          git add docs/screenshots
          git commit -m "Add screenshots from the client smoke test"
          git push origin "screenshots:${{ github.head_ref }}"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-test-logs
          path: |
            server.log
            client.log
            run/logs/
            run/crash-reports/
            screenshots/
          if-no-files-found: ignore

  release:
    needs: [build, smoke-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download mod jar
        uses: actions/download-artifact@v5
        with:
          name: amogusmod
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
