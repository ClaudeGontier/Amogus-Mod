name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release (tag v<mod_version>) from this run'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v5
        with:
          name: amogusmod
          path: build/libs/*.jar
          if-no-files-found: error

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri imagemagick xdotool

      - name: Start dedicated server
        run: .github/scripts/smoke-test.sh server

      - name: Start client
        run: .github/scripts/smoke-test.sh client

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-test-logs
          path: |
            server.log
            client.log
            run/logs/
            run/crash-reports/
            screenshots/
          if-no-files-found: ignore

  release:
    needs: [build, smoke-test]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read mod version
        id: version
        run: |
          mod_version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          minecraft_version=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          if [ "${{ github.ref_type }}" = tag ]; then tag="${{ github.ref_name }}"; else tag="v$mod_version"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=AMOGUS $mod_version (Minecraft $minecraft_version)" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$minecraft_version" >> "$GITHUB_OUTPUT"

      - name: Download mod jar
        uses: actions/download-artifact@v5
        with:
          name: amogusmod
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.name }}
          body: |
            For Minecraft ${{ steps.version.outputs.minecraft_version }} with NeoForge. Requires [GeckoLib](https://modrinth.com/mod/geckolib) 5.4 or newer.
          files: dist/*.jar
          generate_release_notes: true
